<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Article archive | Audrey Nzilani</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header container"><a class="brand" href="./#articles">← Back to writing</a></header>
  <main class="container section">
    <h1>Article archive</h1>
    <div id="tag-filter" class="tag-row"></div>
    <div id="articles-grid" class="grid"></div>
  </main>
  <script>
    // Articles + Tag filter
    fetch("articles.json")
      .then(res => res.json())
      .then(articles => {
        const tagFilter = document.getElementById("tag-filter");
        const grid = document.getElementById("articles-grid");

        // Collect all tags
        const allTags = new Set();
        articles.forEach(a => a.tags.forEach(t => allTags.add(t)));
        const tagList = ["all", ...Array.from(allTags)];

        // Render tag chips
        tagFilter.innerHTML = tagList
          .map(tag => `<button type="button" class="chip tag-chip${tag === "all" ? " active" : ""}" data-tag="${tag}">#${tag}</button>`)
          .join("");

        // Render function
        const renderArticles = (filterTag = "all") => {
          const filtered = articles.filter(a => filterTag === "all" || a.tags.includes(filterTag));
          grid.innerHTML = filtered.map(a => {
            const articleLink = `article.html?file=${encodeURIComponent(a.file)}`;
            return `
              <article class="card">
                <h3>${a.title}</h3>
                <p>${a.desc}</p>
                <div class="chip-row">
                  <a class="chip" href="${articleLink}" target="_blank" rel="noopener">Read</a>
                  ${a.tags.map(t => `<span class="chip subtag">#${t}</span>`).join(' ')}
                </div>
              </article>
            `;
          }).join('');
        };

        // Initial render
        renderArticles("all");

        // Tag filtering logic
        tagFilter.addEventListener("click", e => {
          if (!e.target.classList.contains("tag-chip")) return;
          const clickedTag = e.target.dataset.tag;
          document.querySelectorAll(".tag-chip").forEach(c =>
            c.classList.toggle("active", c.dataset.tag === clickedTag)
          );
          renderArticles(clickedTag);
        });
      })
      .catch(err => {
        console.error("Error loading articles:", err);
        document.getElementById("articles-grid").innerHTML = `<p>⚠️ Could not load articles (${err.message})</p>`;
      });
  </script>
</body>
</html>
